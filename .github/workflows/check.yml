name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the lint ratchet below diffs against a base commit.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Linux sandbox backend
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap iproute2
          # Permit the namespace backend on this disposable hosted runner.
          # This is CI provisioning, not a change to consumer host policy.
          # Ubuntu 24.04 otherwise denies bwrap's loopback setup.
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --ro-bind / / --unshare-net -- /bin/true

      - name: go fmt (verify)
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "Files need gofmt:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # .golangci.yml is the portfolio go-baseline config. Lint findings that
      # predate it (243 at 663610c, listed in the PR that added the config) are
      # ratcheted: only lines changed since that commit are linted, so new
      # code meets the standard while the backlog is cleaned up separately.
      # Drop --new-from-rev once the full run is clean.
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.4
          install-mode: goinstall
          args: --new-from-rev=663610c999ffca9979acfb2e5ef6b9ce0cee6422

      - name: go test -race
        run: go test -race -count=1 ./...

      # Pinned, not @latest: an unpinned scanner changes its verdict without a
      # commit. v1.8.0 declares `go 1.26.0`.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
